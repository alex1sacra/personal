<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f0f11;
      color: #e5e5e5;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: #111214;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav .logo {
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    nav a {
      text-decoration: none;
      color: #e5e5e5;
      margin: 0 12px;
      font-size: 0.95rem;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 120px 80px;
      max-width: 1400px;
      margin: auto;
    }
    .hero-text h2 {
      font-size: 1rem;
      color: #aaaaaa;
    }
    .hero-text h1 {
      font-size: 4rem;
      margin: 10px 0;
      color: white;
    }
    .hero-text h3 {
      font-size: 2.5rem;
      color: #8f8f8f;
      margin: 0 0 20px 0;
    }
    .hero-text p {
      width: 80%;
      line-height: 1.6;
      color: #c3c3c3;
    }
    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 20px;
    }
    .btn {
      padding: 12px 25px;
      border-radius: 10px;
      border: 2px solid #e5e5e5;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    .icon-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .hero-img img {
      width: 300px;
      height: 300px;
      border-radius: 20px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">🔷 My Portfolio</div>
    <div>
      <a href="#about">About Me</a>
      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h2>Hi, my name is</h2>
      <h1>Your Name.</h1>
      <h3>I build things for the web</h3>
      <p>A passionate web developer. I use modern web technologies to build websites that look great, feel fantastic, and function correctly.</p>

      <div class="buttons">
        <button class="btn">Resume</button>
        <div class="icon-btn">🐱</div>
        <div class="icon-btn">✖</div>
        <div class="icon-btn">💠</div>
      </div>
    </div>

    <div class="hero-img">
      <img src="https://via.placeholder.com/300x300.png?text=Your+Image" alt="profile" />
    </div>
  </section>
</body>
</html>
